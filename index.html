<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131c">
  <title>Pong — Arcade</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #10131c;
      color: #f3f5ff;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(ellipse at 50% 40%, #1d2434 0%, #10131c 72%);
    }

    .game-shell { width: min(920px, 100%); }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin: 0 0 16px;
    }

    .eyebrow {
      margin: 0 0 5px;
      color: #8e9bb8;
      font-size: .72rem;
      font-weight: 750;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    h1 { margin: 0; font-size: clamp(1.7rem, 5vw, 2.5rem); letter-spacing: -.05em; }

    .scoreboard { display: flex; align-items: center; gap: 20px; font-variant-numeric: tabular-nums; }
    .score { display: grid; gap: 2px; min-width: 46px; text-align: center; }
    .score span:first-child { color: #8e9bb8; font-size: .65rem; font-weight: 750; letter-spacing: .12em; }
    .score strong { font-size: 1.65rem; }
    .score-divider { color: #536079; font-size: 1.25rem; }

    .arena {
      position: relative;
      overflow: hidden;
      border: 1px solid #343d51;
      border-radius: 14px;
      background: #0b0e16;
      box-shadow: 0 24px 80px #0007, inset 0 0 40px #151b2a;
    }

    canvas { display: block; width: 100%; aspect-ratio: 16 / 9; touch-action: none; }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #080b12b8;
      text-align: center;
      transition: opacity .2s ease, visibility .2s ease;
    }

    .overlay[hidden] { display: none; }
    .overlay-card { max-width: 360px; }
    .overlay h2 { margin: 0 0 8px; font-size: clamp(1.5rem, 4vw, 2rem); }
    .overlay p { margin: 0 0 20px; color: #aab4ca; line-height: 1.55; }

    button {
      border: 0;
      border-radius: 9px;
      padding: 11px 20px;
      background: #a7f36a;
      color: #15200e;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 5px 20px #a7f36a30;
    }
    button:hover { background: #b9ff7d; }
    button:focus-visible { outline: 3px solid white; outline-offset: 3px; }

    .help {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 10px 24px;
      padding: 14px 2px 0;
      color: #8e9bb8;
      font-size: .82rem;
    }
    .key {
      display: inline-block;
      border: 1px solid #3b465c;
      border-radius: 4px;
      padding: 1px 5px;
      color: #dce3f5;
      font-size: .72rem;
    }

    @media (max-width: 520px) {
      body { padding: 16px; }
      header { align-items: center; }
      .scoreboard { gap: 10px; }
      .score strong { font-size: 1.35rem; }
      .help { flex-direction: column; }
    }
  </style>
</head>
<body>
  <main class="game-shell">
    <header>
      <div>
        <p class="eyebrow">A tiny arcade classic</p>
        <h1>Pong</h1>
      </div>
      <div class="scoreboard" aria-label="Scoreboard">
        <div class="score"><span>YOU</span><strong id="player-score">0</strong></div>
        <span class="score-divider" aria-hidden="true">:</span>
        <div class="score"><span>COMPUTER</span><strong id="computer-score">0</strong></div>
      </div>
    </header>

    <section class="arena" aria-label="Pong game">
      <canvas id="game" aria-label="Pong playing field"></canvas>
      <div class="overlay" id="overlay">
        <div class="overlay-card">
          <h2 id="overlay-title">Ready to play?</h2>
          <p id="overlay-message">Move your mouse over the court or use the up and down arrow keys. First to 7 wins!</p>
          <button id="start-button" type="button">Start game</button>
        </div>
      </div>
    </section>

    <div class="help">
      <span>Move: mouse or <span class="key">↑</span> <span class="key">↓</span></span>
      <span>First to 7 points wins · Press <span class="key">Space</span> to pause</span>
    </div>
  </main>

  <script>
    (() => {
      const canvas = document.querySelector('#game');
      const ctx = canvas.getContext('2d');
      const overlay = document.querySelector('#overlay');
      const title = document.querySelector('#overlay-title');
      const message = document.querySelector('#overlay-message');
      const startButton = document.querySelector('#start-button');
      const playerScoreText = document.querySelector('#player-score');
      const computerScoreText = document.querySelector('#computer-score');
      const WIN_SCORE = 7;
      const keys = new Set();
      const game = {
        width: 960,
        height: 540,
        player: { x: 30, y: 0, width: 14, height: 96, score: 0 },
        computer: { x: 916, y: 0, width: 14, height: 96, score: 0 },
        ball: { x: 480, y: 270, radius: 9, vx: 390, vy: 150 },
        running: false,
        lastTime: 0
      };

      function resizeCanvas() {
        const rect = canvas.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(rect.width * dpr);
        canvas.height = Math.round(rect.height * dpr);
        ctx.setTransform(canvas.width / game.width, 0, 0, canvas.height / game.height, 0, 0);
        draw();
      }

      function resetBall(direction = Math.random() < 0.5 ? -1 : 1) {
        game.ball.x = game.width / 2;
        game.ball.y = game.height / 2;
        const speed = 390;
        const angle = (Math.random() * 0.7 - 0.35);
        game.ball.vx = Math.cos(angle) * speed * direction;
        game.ball.vy = Math.sin(angle) * speed;
      }

      function draw() {
        const { width, height, player, computer, ball } = game;
        ctx.clearRect(0, 0, width, height);
        ctx.fillStyle = '#0b0e16';
        ctx.fillRect(0, 0, width, height);

        ctx.setLineDash([12, 14]);
        ctx.strokeStyle = '#273044';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(width / 2, 0);
        ctx.lineTo(width / 2, height);
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.fillStyle = '#a7f36a';
        ctx.shadowColor = '#a7f36a';
        ctx.shadowBlur = 18;
        ctx.fillRect(player.x, player.y, player.width, player.height);
        ctx.fillStyle = '#aab8d5';
        ctx.shadowColor = '#aab8d5';
        ctx.fillRect(computer.x, computer.y, computer.width, computer.height);
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#f6f7fb';
        ctx.shadowColor = '#ffffff';
        ctx.shadowBlur = 20;
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      function movePlayerTo(y) {
        game.player.y = Math.max(0, Math.min(game.height - game.player.height, y - game.player.height / 2));
      }

      function update(dt) {
        const { player, computer, ball, height, width } = game;
        const playerSpeed = 560;
        if (keys.has('ArrowUp')) player.y -= playerSpeed * dt;
        if (keys.has('ArrowDown')) player.y += playerSpeed * dt;
        player.y = Math.max(0, Math.min(height - player.height, player.y));

        // The computer tracks the ball, but its movement is deliberately limited.
        const aiTarget = ball.y - computer.height / 2;
        const aiSpeed = 340;
        const aiDelta = aiTarget - computer.y;
        computer.y += Math.max(-aiSpeed * dt, Math.min(aiSpeed * dt, aiDelta));
        computer.y = Math.max(0, Math.min(height - computer.height, computer.y));

        ball.x += ball.vx * dt;
        ball.y += ball.vy * dt;

        if (ball.y - ball.radius <= 0) {
          ball.y = ball.radius;
          ball.vy = Math.abs(ball.vy);
        } else if (ball.y + ball.radius >= height) {
          ball.y = height - ball.radius;
          ball.vy = -Math.abs(ball.vy);
        }

        if (ball.vx < 0 && ball.x - ball.radius <= player.x + player.width &&
            ball.x + ball.radius >= player.x && ball.y + ball.radius >= player.y &&
            ball.y - ball.radius <= player.y + player.height) {
          ball.x = player.x + player.width + ball.radius;
          bounceFromPaddle(player, 1);
        }
        if (ball.vx > 0 && ball.x + ball.radius >= computer.x &&
            ball.x - ball.radius <= computer.x + computer.width && ball.y + ball.radius >= computer.y &&
            ball.y - ball.radius <= computer.y + computer.height) {
          ball.x = computer.x - ball.radius;
          bounceFromPaddle(computer, -1);
        }

        if (ball.x + ball.radius < 0) {
          computer.score++;
          updateScores();
          pointScored('computer');
        } else if (ball.x - ball.radius > width) {
          player.score++;
          updateScores();
          pointScored('player');
        }
      }

      function bounceFromPaddle(paddle, direction) {
        const ball = game.ball;
        const hit = (ball.y - (paddle.y + paddle.height / 2)) / (paddle.height / 2);
        const speed = Math.min(Math.hypot(ball.vx, ball.vy) * 1.06, 760);
        const angle = hit * (Math.PI / 3);
        ball.vx = Math.cos(angle) * speed * direction;
        ball.vy = Math.sin(angle) * speed;
      }

      function updateScores() {
        playerScoreText.textContent = game.player.score;
        computerScoreText.textContent = game.computer.score;
      }

      function pointScored(winner) {
        if (game.player.score >= WIN_SCORE || game.computer.score >= WIN_SCORE) {
          game.running = false;
          title.textContent = game.player.score >= WIN_SCORE ? 'You win!' : 'Computer wins!';
          message.textContent = `Final score: ${game.player.score} — ${game.computer.score}. Want a rematch?`;
          startButton.textContent = 'Play again';
          overlay.hidden = false;
          return;
        }
        resetBall(winner === 'player' ? 1 : -1);
      }

      function frame(time) {
        const dt = Math.min((time - (game.lastTime || time)) / 1000, 0.032);
        game.lastTime = time;
        if (game.running) update(dt);
        draw();
        requestAnimationFrame(frame);
      }

      function startGame() {
        if (game.player.score >= WIN_SCORE || game.computer.score >= WIN_SCORE) {
          game.player.score = 0;
          game.computer.score = 0;
          updateScores();
          game.player.y = game.height / 2 - game.player.height / 2;
          game.computer.y = game.height / 2 - game.computer.height / 2;
        }
        resetBall();
        game.running = true;
        overlay.hidden = true;
        canvas.focus?.();
      }

      canvas.addEventListener('pointermove', (event) => {
        const rect = canvas.getBoundingClientRect();
        const scaleY = game.height / rect.height;
        movePlayerTo((event.clientY - rect.top) * scaleY);
      });

      window.addEventListener('keydown', (event) => {
        if (event.key === 'ArrowUp' || event.key === 'ArrowDown') {
          keys.add(event.key);
          event.preventDefault();
        }
        if (event.code === 'Space') {
          event.preventDefault();
          if (game.running) {
            game.running = false;
            title.textContent = 'Paused';
            message.textContent = 'Take a breather. Your score is saved.';
            startButton.textContent = 'Resume';
            overlay.hidden = false;
          } else if (overlay.hidden === false && game.player.score < WIN_SCORE && game.computer.score < WIN_SCORE && startButton.textContent === 'Resume') {
            startGame();
          }
        }
      });
      window.addEventListener('keyup', (event) => keys.delete(event.key));
      window.addEventListener('blur', () => keys.clear());
      startButton.addEventListener('click', startGame);
      window.addEventListener('resize', resizeCanvas);

      game.player.y = game.height / 2 - game.player.height / 2;
      game.computer.y = game.height / 2 - game.computer.height / 2;
      resizeCanvas();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
